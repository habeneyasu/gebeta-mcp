[project]
name = "gebeta-mcp"
version = "0.1.0"
description = "Deterministic Gebeta game engine exposed through FastAPI, MCP, and a web UI for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "mcp>=1.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]

[project.scripts]
gebeta = "gebeta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gebeta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["gebeta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "gebeta"

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["gebeta.domain"]
forbidden_modules = ["gebeta.application", "gebeta.infrastructure", "gebeta.api", "gebeta.mcp", "gebeta.agents", "gebeta.ui", "gebeta.config", "gebeta.schemas"]

[[tool.importlinter.contracts]]
name = "Application depends only on domain"
type = "forbidden"
source_modules = ["gebeta.application"]
forbidden_modules = ["gebeta.infrastructure", "gebeta.api", "gebeta.mcp", "gebeta.agents", "gebeta.ui"]

[[tool.importlinter.contracts]]
name = "Agents and MCP client reach the game only through MCP"
type = "forbidden"
source_modules = ["gebeta.agents", "gebeta.mcp.client"]
forbidden_modules = ["gebeta.domain", "gebeta.application", "gebeta.infrastructure", "gebeta.api"]
